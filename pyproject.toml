[build-system]
requires = ["setuptools>=64", "setuptools_scm>=8"]
build-backend = "setuptools.build_meta"

[project]
name = "qed_nlce"
version = "0.1.0"
description = "Numerical Linked Cluster Expansion (NLCE) workflow built on top of the QED exact-diagonalization toolkit."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [
    { name = "QED collaborators" },
]
keywords = ["nlce", "exact-diagonalization", "quantum", "spin-models", "frustrated-magnetism"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Scientific/Engineering :: Physics",
]
dependencies = [
    "numpy>=1.23",
    "scipy>=1.10",
    "h5py>=3.7",
    "matplotlib>=3.6",
    "networkx>=3.0",
    "pandas>=1.5",
    "tqdm>=4.64",
]

[project.optional-dependencies]
# In-process backend: route per-cluster ED through the qed Python
# bindings instead of forking ./ED. Hugely faster on workflows with
# many small clusters (typical at high NLCE orders) because it skips
# the subprocess fork + OpenMP/CUDA initialization per cluster.
# Required for ``--in_process`` / ``--auto_in_process`` and for
# build-introspection preflight on ``--method=FULL_GPU`` etc.
qed = ["qed>=0.2.0"]
dev = ["pytest>=7", "pytest-xdist>=3"]

[project.scripts]
qed-nlce = "qed_nlce.cli:main"

[project.urls]
Homepage = "https://github.com/ze-bang/QED_NLCE"
Source = "https://github.com/ze-bang/QED_NLCE"
"Bug Tracker" = "https://github.com/ze-bang/QED_NLCE/issues"
"QED toolkit" = "https://github.com/ze-bang/QED"

[tool.setuptools.packages.find]
where = ["."]
include = ["qed_nlce*"]
exclude = ["tests*"]
