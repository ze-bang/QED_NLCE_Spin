[build-system]
requires = ["setuptools>=64", "setuptools_scm>=8"]
build-backend = "setuptools.build_meta"

[project]
name = "qed_nlce"
version = "0.1.0"
description = "Self-contained Numerical Linked Cluster Expansion (NLCE) workflow with symmetry-adapted full dense exact diagonalization."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [
    { name = "QED collaborators" },
]
keywords = ["nlce", "exact-diagonalization", "quantum", "spin-models", "frustrated-magnetism"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Scientific/Engineering :: Physics",
]
dependencies = [
    # The symmetry-adapted dense diagonalizer is built on
    # numpy + scipy.linalg.eigh (LAPACK) only. Cluster *generation*
    # (qed_nlce.prep) additionally requires pynauty for canonical graph
    # certificates and automorphism counts.
    "numpy>=1.23",
    "scipy>=1.10",
    "h5py>=3.7",
    "matplotlib>=3.6",
    "networkx>=3.0",
    "pandas>=1.5",
    "tqdm>=4.64",
    "pynauty>=2.8",
]

[project.optional-dependencies]
dev = ["pytest>=7", "pytest-xdist>=3"]

[tool.pytest.ini_options]
# Only collect the real test-suite; analysis/ contains CLI scripts that
# happen to be named ``test_*`` and are not pytest modules.
testpaths = ["tests"]

[project.scripts]
qed-nlce = "qed_nlce.cli:main"
qed-nlce-convergence-report = "qed_nlce.analysis.convergence_report:main"

[project.urls]
Homepage = "https://github.com/ze-bang/QED_NLCE"
Source = "https://github.com/ze-bang/QED_NLCE"
"Bug Tracker" = "https://github.com/ze-bang/QED_NLCE/issues"
"QED toolkit" = "https://github.com/ze-bang/QED"

[tool.setuptools.packages.find]
where = ["."]
include = ["qed_nlce*"]
exclude = ["tests*"]
